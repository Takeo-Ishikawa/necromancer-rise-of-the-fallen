name: Android APK

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify combat and summoning rules
        run: |
          mkdir -p "$RUNNER_TEMP/world-tests"
          javac -d "$RUNNER_TEMP/world-tests" app/src/main/java/com/takeo/necromancer/World.java tests/com/takeo/necromancer/WorldSmokeTest.java tests/com/takeo/necromancer/WorldProgressionTest.java tests/com/takeo/necromancer/WorldExplorationTest.java tests/com/takeo/necromancer/CaveExpansionTest.java
          java -cp "$RUNNER_TEMP/world-tests" com.takeo.necromancer.WorldSmokeTest
          java -cp "$RUNNER_TEMP/world-tests" com.takeo.necromancer.WorldProgressionTest
          java -cp "$RUNNER_TEMP/world-tests" com.takeo.necromancer.WorldExplorationTest
          java -cp "$RUNNER_TEMP/world-tests" com.takeo.necromancer.CaveExpansionTest
      - name: Install Android SDK 35
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build native debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: necromancer-android-v0.4
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
