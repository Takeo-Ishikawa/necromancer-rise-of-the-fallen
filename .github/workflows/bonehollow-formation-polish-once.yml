name: Bonehollow companion formation one-shot Android
on:
  push:
    branches:
      - feature/bonehollow-caverna-unificada
    paths:
      - docs/REQUEST_BONEHOLLOW_FORMATION_ANDROID_ONCE.md
permissions:
  actions: write
  contents: read
jobs:
  dispatch-android:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch stable signed Android preview
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${TARGET_REPO}/actions/workflows/unity-android.yml/dispatches" -f ref="${TARGET_BRANCH}"
          echo "Requested Android build on ${TARGET_BRANCH}"
