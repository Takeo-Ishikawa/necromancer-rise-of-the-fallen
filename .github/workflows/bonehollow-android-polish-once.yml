name: Bonehollow one-time Android quality pass
# Temporary workflow to trigger explicitly requested Android validation.
# The permanent Android workflow stays workflow_dispatch-only.
on:
  push:
    branches:
      - feature/bonehollow-caverna-unificada
    paths:
      - docs/bonehollow_android_polish_validation_once.md
permissions:
  contents: read
  actions: write
jobs:
  dispatch-android:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the existing manual Android workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${REPO}/actions/workflows/unity-android.yml/dispatches" -f ref="${REF}"
          echo "Manual Android preview dispatched for ${REF}"
