name: One-time Bonehollow Android dispatch
# Disposable workflow for the specific APK build requested in this session.
# Does not change the project's manual-only Android/Windows workflows.
on:
  push:
    branches:
      - feature/bonehollow-baseline-mapa-01
    paths:
      - 'docs/bonehollow/REQUEST_ANDROID_PREVIEW_2026_11_13_V2.md'
permissions:
  actions: write
  contents: read
jobs:
  dispatch-existing-manual-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Request the existing Unity Android Preview APK workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REPO_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${REPO_NAME}/actions/workflows/unity-android.yml/dispatches" -f ref="${REF_NAME}"
          echo "Existing manual Android workflow dispatch accepted for ref ${REF_NAME}"
