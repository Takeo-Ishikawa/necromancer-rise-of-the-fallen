name: Bonehollow entrance Android single validation
on:
  push:
    branches:
      - feature/bonehollow-caverna-unificada
    paths:
      - docs/REQUEST_BONEHOLLOW_ENTRANCE_ANDROID_ONCE.md
permissions:
  actions: write
  contents: read
jobs:
  dispatch-android:
    runs-on: ubuntu-latest
    steps:
      - name: Request the existing manually configured Android preview
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${TARGET_REPO}/actions/workflows/unity-android.yml/dispatches" -f ref="${TARGET_REF}"
          echo "Android preview dispatched for modular Bonehollow entrance"
