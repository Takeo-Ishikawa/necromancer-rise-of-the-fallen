name: Unity Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'unity/**'
      - '.github/workflows/unity-android.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Unity 2022.3 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - name: Verify Unity project structure
        run: python tests/check_unity_project.py
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      - name: Unity Builder - APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: unity
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: necromancer-unity
          buildsPath: build
          versioning: Semantic
      - name: Publish Unity APK
        uses: actions/upload-artifact@v4
        with:
          name: necromancer-unity-android-apk
          path: build/Android/**/*.apk
          if-no-files-found: error
