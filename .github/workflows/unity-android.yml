name: Unity Android Preview APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'unity/**'
      - '.github/workflows/unity-android.yml'

concurrency:
  group: unity-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    name: Unity 2022.3 Safe Preview
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - name: Verify Unity project structure
        run: python tests/check_unity_project.py
      - name: Verify Unity license configured
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo "::error::Unity license missing. Add UNITY_LICENSE (Unity Personal ULF) or UNITY_SERIAL (Unity Pro) in GitHub Actions secrets."
            exit 1
          fi
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      - name: Unity Builder - APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          NECRO_ANDROID_MODE: preview
        with:
          projectPath: unity
          buildMethod: Necromancer.EditorTools.NecromancerAndroidBuild.BuildAndroid
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: necromancer-unity
          buildsPath: build
          versioning: Semantic
      - name: Publish separately-installable preview
        uses: actions/upload-artifact@v4
        with:
          name: necromancer-unity-preview-apk
          path: build/**/*.apk
          if-no-files-found: error
