name: Unity Android Preview APK

# Only compile Android when explicitly requested. The lightweight static
# structure workflow continues to run automatically on source changes.
on:
  workflow_dispatch:
  # Explicit workflow-only push trigger enables authenticated build requests
  # without compiling on ordinary Unity source changes.
  push:
    branches: [main]
    paths:
      - '.github/workflows/unity-android.yml'

concurrency:
  group: unity-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    name: Unity 2022.3 Safe Preview
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - name: Verify Unity project structure
        run: python tests/check_unity_project.py
      - name: Verify Unity license configured
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo "::error::Unity license missing. Add UNITY_LICENSE (Unity Personal ULF) or UNITY_SERIAL (Unity Pro) in GitHub Actions secrets."
            exit 1
          fi
      - name: Verify stable preview signing identity
        shell: bash
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.PREVIEW_KEYSTORE_BASE64 }}
          PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$PREVIEW_KEYSTORE_BASE64" ] || [ -z "$PREVIEW_KEYSTORE_PASSWORD" ]; then
            echo "::error::Configure PREVIEW_KEYSTORE_BASE64 and PREVIEW_KEYSTORE_PASSWORD once, in Settings > Secrets and variables > Actions. See docs/ANDROID_SIGNING.md. Unsigned or ephemeral-debug APKs cannot update an installed copy."
            exit 1
          fi
          umask 077
          printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > unity/.android-preview.keystore
          test -s unity/.android-preview.keystore
          keytool -list -storetype PKCS12 -keystore unity/.android-preview.keystore \
            -storepass "$PREVIEW_KEYSTORE_PASSWORD" -alias necromancer-preview > /dev/null
          echo "Stable preview signing key loaded; alias validated."

      - name: Prepare protected Unity build settings
        shell: bash
        env:
          PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.PREVIEW_KEYSTORE_PASSWORD }}
          PREVIEW_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          secret = os.environ["PREVIEW_KEYSTORE_PASSWORD"]
          run_number = int(os.environ["PREVIEW_RUN_NUMBER"])
          if not secret or run_number <= 0:
              raise SystemExit("Missing preview key password or build number")
          config = {
              "mode": "preview",
              "previewRunNumber": run_number,
              "keystorePassword": secret,
              "keyAlias": "necromancer-preview",
              "keyPassword": secret,
          }
          dest = Path("unity/.android-build-settings.json")
          dest.write_text(json.dumps(config), encoding="utf-8")
          dest.chmod(0o600)
          print("Protected Unity build settings prepared (no secret values logged).")
          PY

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      - name: Unity Builder - APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          # Build mode, version code and passwords are read from the protected
          # project-root file (GameCI v4 drops custom workflow env variables).
        with:
          projectPath: unity
          buildMethod: Necromancer.EditorTools.NecromancerAndroidBuild.BuildAndroid
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: necromancer-unity
          buildsPath: build
          versioning: None
      - name: Record APK size in workflow summary
        run: |
          echo "### APK Unity Android — tamanho real" >> "$GITHUB_STEP_SUMMARY"
          find build -type f -name '*.apk' -printf '%p | %s bytes\n' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish direct APK (no ZIP container)
        uses: actions/upload-artifact@v7
        with:
          name: necromancer-preview-apk
          path: build/Android/necromancer-unity.apk
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary preview credentials
        if: always()
        run: rm -f unity/.android-preview.keystore unity/.android-build-settings.json
